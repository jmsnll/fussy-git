[package]
name = "fussy-git"
version = "0.1.1"
edition = "2021"
description = "Keeps cloned git repositories organised under a configurable root, by remote URL"
license = "MIT"
repository = "https://github.com/jmsnll/fussy-git"
homepage = "https://github.com/jmsnll/fussy-git"
readme = "README.md"
keywords = ["git", "repository", "cli", "workspace", "clone"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[[bin]]
name = "fussy-git"
path = "src/main.rs"

[lib]
name = "fussy_git"
path = "src/lib.rs"

[dependencies]
anstyle = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
globset = "0.4"
anyhow = "1"
thiserror = "2"
dirs = "7"
shellexpand = "3"
walkdir = "2"
# crossterm is used via ratatui's re-export (ratatui::crossterm) so the two
# versions cannot drift apart.
ratatui = "0.30"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Smaller, faster release binaries. `panic = "abort"` is deliberately left
# unset: `ops::for_each_repo` relies on `catch_unwind` to keep one panicking
# repository from killing a whole batch.
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "jmsnll/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). Windows is
# omitted: the reconcile/adopt symlink fallback uses `std::os::unix`.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
